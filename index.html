<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>World Cup Predictor</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bracketry/dist/bracketry.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #bracket {
            width: 100%;
            height: 800px;
        }
    </style>
</head>
<body>

<h1>🏆 World Cup Predictor</h1>

<div id="bracket"></div>

<script type="module">
import { createBracket } from "https://cdn.jsdelivr.net/npm/bracketry/+esm";

const data = {
  rounds: [
    { name: "Final" }
  ],

  matches: [
    {
      roundIndex: 0,
      order: 0,
      sides: [
        { contestantId: "eng" },
        { contestantId: "bra" }
      ]
    }
  ],

  contestants: {
    eng: {
      players: [{ title: "England" }]
    },
    bra: {
      players: [{ title: "Brazil" }]
    }
  }
};

createBracket(
  data,
  document.getElementById("bracket")
);
</script>

</body>
</html>

    </script>
</body>
</html>
